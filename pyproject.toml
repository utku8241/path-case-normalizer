[project]
name = "path-case-normalizer"
version = "0.1.2"
description = "Normalizes path casing for case-insensitive filesystems to detect duplicate paths differing only in case."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
